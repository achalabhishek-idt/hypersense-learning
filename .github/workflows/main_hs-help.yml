name: Build and deploy Zensical docs to Azure Web App - HS-help

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Build static site
        run: zensical build --clean

      - name: Copy web.config to site directory
        run: cp web.config site/web.config

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HS-help'
          slot-name: 'Production'
          package: site
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5DE8E2EA437B47DEBAA16060E0C0D921 }}